<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#633e68"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="TimeNote"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>TimeNote</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#302436;background:#faf7fb}*{box-sizing:border-box}body{margin:0}main{max-width:650px;margin:auto;padding:20px 16px 90px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:28px;margin:12px 0 4px}p{color:#746b78}button,input,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:12px 16px;background:#633e68;color:white}button.secondary{background:#eee7f0;color:#53385b}button.danger{background:#f9e6e6;color:#9a2525}.panel{background:white;border:1px solid #eadfeb;border-radius:18px;padding:16px;margin-top:16px;box-shadow:0 5px 22px #4a265008}.month{display:flex;align-items:center;justify-content:space-between}.month h2{font-size:19px}.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.week{text-align:center;color:#8c8190;font-size:13px;padding:12px 0}.day{min-height:49px;padding:5px 0;border-radius:12px;background:#faf7fb;color:#443747;position:relative}.day.selected{background:#633e68;color:white}.day.today{outline:2px solid #b28bb6}.dot{display:block;width:5px;height:5px;background:#ca8bd1;border-radius:50%;margin:3px auto}.day.selected .dot{background:white}.task{display:flex;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid #f0e9f0}.task:last-child{border-bottom:0}.task .info{flex:1;min-width:0}.task strong{display:block;overflow-wrap:anywhere}.task small{color:#85778a}.task.done strong{text-decoration:line-through;color:#999}.task input[type=checkbox]{width:21px;height:21px;accent-color:#633e68}.task button{padding:8px}label{display:block;margin:12px 0 5px;font-weight:600;font-size:14px}input[type=text],input[type=date],input[type=time],textarea{width:100%;border:1px solid #ded2e0;border-radius:10px;padding:12px;background:white;color:#302436}textarea{min-height:70px}form[hidden],#installHelp[hidden]{display:none}.actions{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}.hint{font-size:13px;line-height:1.6}.status{background:#f2edf5;padding:12px;border-radius:12px;font-size:13px}.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.row label{margin:0}#toast{position:fixed;bottom:18px;left:16px;right:16px;max-width:600px;margin:auto;background:#33283a;color:white;border-radius:14px;padding:14px;display:none}#toast.show{display:block}
</style></head><body><main><header><div><h1>🗓️ TimeNote</h1><p style="margin:0">일정과 할 일을 한곳에</p></div><button id="newBtn">+ 추가</button></header><section class="panel"><div class="month"><button class="secondary" id="prev" aria-label="이전 달">‹</button><h2 id="monthTitle"></h2><button class="secondary" id="next" aria-label="다음 달">›</button></div><div class="week"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div class="days" id="days"></div></section><section class="panel"><div class="row"><h2 id="selectedTitle" style="font-size:18px"></h2><button class="secondary" id="todayBtn">오늘</button></div><div id="tasks"></div></section><form class="panel" id="form" hidden><h2 id="formTitle">일정 추가</h2><input type="hidden" id="editId"><label for="title">할 일 *</label><input id="title" type="text" maxlength="120" required placeholder="예: 약 먹기, 공부하기"><label for="date">날짜 *</label><input id="date" type="date" required><label for="time">시간 *</label><input id="time" type="time" required><label for="memo">메모</label><textarea id="memo" maxlength="1000" placeholder="필요한 내용을 적으세요"></textarea><label class="row" for="alarm"><span>알림 사용 (앱이 열려 있을 때)</span><input type="checkbox" id="alarm" checked></label><div class="actions"><button type="submit">저장</button><button type="button" class="secondary" id="cancel">취소</button></div></form><section class="panel"><h2 style="font-size:18px">🔔 알림과 설치</h2><p class="hint">이 버전은 앱이 열려 있는 동안 예정 시각에 알림을 표시합니다. 앱이 완전히 닫혔을 때 정확한 시간에 울리는 푸시 알림은 서버와 별도 구현이 필요합니다.</p><div class="actions"><button id="permission">알림 권한 허용</button><button id="test">알림 테스트</button><button class="secondary" id="install">홈 화면에 추가 안내</button></div><div id="installHelp" hidden class="status" style="margin-top:12px"></div><p class="hint">휴대폰 기본 캘린더에 일정을 내보내면, 해당 캘린더 앱의 알림 기능을 이용할 수 있습니다. 내보낸 일정은 TimeNote와 자동 동기화되지 않습니다.</p><button class="secondary" id="export">선택 날짜 일정 내보내기 (.ics)</button><p class="hint">일정은 이 기기의 브라우저 저장소에 보관됩니다. 앱 데이터나 브라우저 저장소를 삭제하면 일정도 사라질 수 있습니다.</p></section></main><div id="toast" role="status" aria-live="polite"></div><script src="app.js" defer></script></body></html>
